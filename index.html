<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loipen-Status</title>
  <meta name="theme-color" content="#1f6feb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Loipen-Status</h1>
    <span id="updated"></span>
    <button id="locate" title="Zu meiner Position">📍</button>
    <button id="reload" title="Aktualisieren">⟳</button>
  </header>
  <div id="map"></div>
  <div id="legend">
    <span><i class="dot ok"></i> befahrbar <b id="n-ok">0</b></span>
    <span><i class="dot no"></i> nicht befahrbar <b id="n-no">0</b></span>
  </div>
  <div id="msg" hidden></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
